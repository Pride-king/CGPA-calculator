<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CGPA Calculator</title>
    <link rel="stylesheet" href="style.css" />
     <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <main>
        <header class="heading">
            <h1>CGPA Calculator</h1>
            <p>Nigerian 5.0 grading scale</p>
        </header>

        <section class="semester-section">
              <h2 id="semester-title">This semester</h2>
        <div class="course-table">
          <div class="course-header" aria-hidden="true">
            <span>Course code</span>
            <span>Units</span>
            <span>Score (0–100)</span>
            <span>Grade</span>
          </div>

          <div class="courses-rows">
                <label
               class="mobile-label coursecode-label" 
               for="course-code-1">
               Course 1 · code
            </label>
                <input  
                id="course-code-1"
                class="course-code"
                type="text" 
             />

                <label 
                class="mobile-label"
                for="units-1">
                Units
            </label>
                <input id="units-1"
                 class="course-units" 
                 type="number"
                  min="1"
                  max="6"
              />

                <label 
                class="mobile-label" 
                for="score-1">
                Score (0–100)
            </label>
            <input 
            id="score-1" 
            class="course-score" 
            type="number" 
            min="0" 
            max="100"
            />

         <div class="grade-cell">
            <span class="mobile-grade-label">Grade</span>
            <output class="grade-output">—</output>
        </div>
          </div>

         <div class="course-row">
            <label 
            class="mobile-label course-code-label" 
            for="course-code-2">
            Course 2 · code
        </label>
            <input 
            id="course-code-2" 
            class="course-code" 
            type="text" 
           />

            <label 
            class="mobile-label" 
            for="units-2">
            Units
        </label>
            <input 
            id="units-2" 
            class="course-units" 
            type="number" 
            min="1" 
            max="6" 
           />

            <label 
            class="mobile-label" 
            for="score-2">
            Score (0–100)
        </label>
            <input 
            id="score-2" 
            class="course-score" 
            type="number" 
            min="0" 
            max="100" 
            />

            <div class="grade-cell">
                <span class="mobile-grade-label">Grade</span>
                <output class="grade-output">—</output>
            </div>
          </div>


           <div class="course-row">
            <label 
            class="mobile-label course-code-label" 
            for="course-code-3">
            Course 3 · code
        </label>
            <input 
            id="course-code-3" 
            class="course-code" 
            type="text" 
            />

            <label 
            class="mobile-label" 
            for="units-3">
            Units
        </label>
            <input 
            id="units-3" 
            class="course-units" 
            type="number" 
            min="1" 
            max="6" 
            />

            <label 
            class="mobile-label" 
            for="score-3">
            Score (0–100)
        </label>
            <input 
            id="score-3" 
            class="course-score" 
            type="number" 
            min="0" 
            max="100" 
            />

            <div class="grade-cell">
                <span class="mobile-grade-label">Grade</span>
                <output class="grade-output" >—</output>
            </div>
          </div>

              <div class="course-row">
            <label 
            class="mobile-label course-code-label" 
            for="course-code-4">
            Course 4 · code
        </label>
            <input 
            id="course-code-4" 
            class="course-code" 
            type="text" 
            aria-label="Course 4 code" />

            <label 
            class="mobile-label" 
            for="units-4">
            Units
        </label>
            <input 
            id="units-4" 
            class="course-units" 
            type="number" 
            min="1" 
            max="6" 
            />

            <label 
            class="mobile-label" 
            for="score-4">
            Score (0–100)
        </label>
            <input 
            id="score-4" 
            class="course-score" 
            type="number" 
            min="0" 
            max="100" 
        />
            <div class="grade-cell">
                <span class="mobile-grade-label">Grade</span>
                <output class="grade-output" aria-label="Course 4 grade">—</output>
            </div>
          </div>

                 <div class="course-row">
            <label 
            class="mobile-label 
            course-code-label" 
            for="course-code-5">
            Course 5 · code
        </label>
            <input 
            id="course-code-5" 
            class="course-code" 
            type="text" 
           />

            <label 
            class="mobile-label" 
            for="units-5">
            Units
        </label>
            <input 
            id="units-5" 
            class="course-units" 
            type="number" 
            min="1" 
            max="6" 
            />

            <label 
            class="mobile-label" 
            for="score-5">
            Score (0–100)
        </label>
            <input 
            id="score-5" 
            class="course-score" 
            type="number" 
            min="0" 
            max="100" 
          />
            <div class="grade-cell">
                <span class="mobile-grade-label">Grade</span>
                <output class="grade-output" aria-label="Course 5 grade">—</output>
            </div>
          </div>
        </div>
        </section>
    </main>












  </body>
</html>
